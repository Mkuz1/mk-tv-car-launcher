<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Car Home</title>
  <link rel="stylesheet" href="car.css">
</head>
<body>
  <!-- Liquid Glass wallpaper: already blurred in the image, so nothing is blurred live -->
  <div id="wall"></div>

  <main id="stage">
    <!-- Dock (left, or bottom on a portrait screen): time, Wi-Fi, recent apps, Settings, App Drawer -->
    <nav id="dock" class="glass">
      <div class="dk-time"><span id="clock"></span><span id="clockAmpm"></span></div>
      <button class="dk-btn round" id="dkWifi" aria-label="Wi-Fi"></button>
      <div class="dk-rule"></div>
      <div id="dkRecents"></div>
      <div class="dk-spacer"></div>
      <!-- Control Center (also: swipe down from the top) -->
      <button class="dk-btn round" id="dkCC" aria-label="Control Center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg>
      </button>
      <!-- Split screen: two apps side by side -->
      <button class="dk-btn round" id="dkSplit" aria-label="Split screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="4" width="8.5" height="16" rx="2.2"/><rect x="13" y="4" width="8.5" height="16" rx="2.2"/></svg>
      </button>
      <button class="dk-btn round" id="dkSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.59-.21l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.36 7.36 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.21L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.21.37.3.59.21l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.36 7.36 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.21l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <button class="dk-btn drawer" id="dkDrawer" aria-label="All apps"></button>
    </nav>

    <section id="main">
      <!-- Home: azkar (travel dua when a trip starts), favorite places, time and prayer times -->
      <div id="home">
        <div id="left">
        <section id="azkar" class="glass">
          <header>
            <div class="az-titles">
              <div class="az-title" id="azTitle" dir="rtl"></div>
              <div class="az-sub" id="azSub"></div>
            </div>
            <div class="az-count" id="azCount"></div>
          </header>
          <div class="az-body" id="azBody" dir="rtl" lang="ar"></div>
          <footer>
            <div class="az-repeat" id="azRepeat" dir="rtl"></div>
            <div class="az-progress"><div id="azBar"></div></div>
          </footer>
        </section>

        </div>

        <section id="prayer" class="glass">
          <div class="p-head">
            <div id="logo" class="logo"></div>
            <div class="p-ctrls">
              <!-- Qibla compass (Home, Work, mosque and petrol are on the Drive screen's map) -->
              <button id="qiblaBtn" aria-label="Qibla"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.6 7.4L12 8l-2.6 1.4zM6 10l6-3 6 3v10l-6 2-6-2z"/></svg></button>
              <button id="langBtn" aria-label="Language"></button>
              <!-- Day / eye comfort / night; night comes on by itself at Maghrib, day at sunrise -->
              <div class="seg" id="modeSeg">
                <button data-m="0" aria-label="Day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
                <button data-m="1" aria-label="Eye comfort"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18V3z"/><path d="M12 3a9 9 0 0 1 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
                <button data-m="2" aria-label="Night"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3a9 9 0 1 0 6.5 15.2A7.5 7.5 0 0 1 14.5 3z"/></svg></button>
              </div>
            </div>
          </div>
          <div class="p-time"><span id="pTime">--:--</span><span id="pAmpm"></span></div>
          <div class="p-date" id="pDate"></div>
          <div class="p-hijri" id="pHijri" dir="rtl"></div>
          <div id="chips"></div>
          <div class="divider"></div>
          <header><div class="label" id="prLabel"></div><div class="pr-next" id="prNext"></div></header>
          <ol id="prList"></ol>
        </section>
      </div>

      <!-- Drive (swipe left from Home), like CarPlay: a big Google map and Now Playing -->
      <div id="drive">
        <section id="dvMap" class="glass">
          <iframe id="mapFrame" title="Map" referrerpolicy="no-referrer-when-downgrade"></iframe>
          <div class="dv-speed" id="dvSpeed" hidden><b id="dvKmh">0</b><span>km/h</span></div>
          <button class="dv-round" id="dvCenter" aria-label="Recenter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
          <div class="dv-bar">
            <button class="dv-go" id="dvMaps"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span data-t="openMaps"></span></button>
            <button class="dv-fav" data-f="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><span data-t="home"></span></button>
            <button class="dv-fav" data-f="work"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6a2 2 0 0 1 2 2v1h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V6a2 2 0 0 1 2-2zm0 3h6V6H9z"/></svg><span data-t="work"></span></button>
            <button class="dv-fav" data-f="mosque"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.3 1.6 1.3 2.6 2.6 3.4C16.4 7 17.5 8.5 17.5 10.5V11h-11v-.5c0-2 1.1-3.5 2.9-4.6 1.3-.8 2.3-1.8 2.6-3.4zM5 12.5h14V21h-4.5v-4a2.5 2.5 0 0 0-5 0v4H5zM2 9.5a1 1 0 0 1 2 0V21H2zm18 0a1 1 0 0 1 2 0V21h-2z"/></svg><span data-t="mosque"></span></button>
            <button class="dv-fav" data-f="fuel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h9a1 1 0 0 1 1 1v8h1.5a2.5 2.5 0 0 1 2.5 2.5V18a1 1 0 0 0 2 0V9.4l-2.7-2.7 1.4-1.4L22.6 9c.3.3.4.6.4 1v8a3 3 0 0 1-6 0v-3.5a.5.5 0 0 0-.5-.5H15v6h1v2H3v-2h1V4a1 1 0 0 1 1-1zm1 2v5h7V5z"/></svg><span data-t="fuel"></span></button>
          </div>
        </section>
        <section id="dvMedia" class="glass">
          <div class="md-app" id="mdApp"></div>
          <div class="md-main">
            <div class="md-art" id="mdArt"></div>
            <div class="md-text">
              <div class="md-title" id="mdTitle"></div>
              <div class="md-artist" id="mdArtist"></div>
            </div>
          </div>
          <div class="md-seek" id="mdSeek"><div class="md-bar"><i id="mdBar"></i></div><div class="md-times"><span id="mdPos"></span><span id="mdDur"></span></div></div>
          <div class="md-ctrls">
            <button id="mdPrev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
            <button id="mdPlay" class="play" aria-label="Play or pause"></button>
            <button id="mdNext" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 5H18v14h-2.4zM4 5v14l10.5-7z"/></svg></button>
          </div>
          <div class="md-hint" id="mdHint" hidden></div>
          <div class="md-sources" id="mdSources"></div>
        </section>
      </div>
      <div id="screenDots"><button data-s="0" aria-label="Home"></button><button data-s="1" aria-label="Drive"></button></div>

      <!-- App drawer: every app, in pages swiped sideways -->
      <div id="drawer" class="glass">
        <div class="dr-head">
          <div class="dr-title" data-t="apps"></div>
          <button class="dr-close" id="drClose" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div id="viewport"><div id="pages"></div></div>
        <div id="dots"></div>
      </div>
    </section>

    <!-- Silent prayer banner: "Asr in 10 minutes", then "It's time for Asr" -->
    <div id="alert" class="glass solid" hidden></div>

    <!-- Move mode: hint and Done (like the TV) -->
    <div id="moveBar" class="glass solid" hidden>
      <span data-t="moveHint"></span>
      <button id="moveDone" data-t="done"></button>
    </div>

    <!-- Open folder -->
    <div id="folder">
      <div class="fd-platter glass solid">
        <div class="fd-title" id="fdTitle"></div>
        <div class="fd-scroll" id="fdScroll"><div class="fd-grid" id="fdGrid"></div></div>
      </div>
    </div>

    <!-- Qibla: a compass turned to the car's direction (or north up), the Kaaba marked on the ring -->
    <div id="qibla">
      <div class="qb-panel glass solid">
        <button class="dr-close" id="qbClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <div class="qb-title" data-t="qiblaTitle"></div>
        <div class="qb-dial">
          <div id="qbRose">
            <svg viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
              <g stroke="rgba(255,255,255,.45)" stroke-width="2" id="qbTicks"></g>
              <text x="100" y="30" text-anchor="middle" class="qb-n">N</text>
              <g id="qbKaaba"><line x1="100" y1="100" x2="100" y2="22" stroke="#E2BC74" stroke-width="5" stroke-linecap="round"/>
                <rect x="88" y="6" width="24" height="24" rx="3" fill="#1B1407" stroke="#E2BC74" stroke-width="2.5"/>
                <rect x="88" y="12" width="24" height="4" fill="#E2BC74"/></g>
            </svg>
          </div>
          <!-- The car, always pointing up -->
          <svg class="qb-car" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l7 19-7-4-7 4z"/></svg>
        </div>
        <div class="qb-main" id="qbMain"></div>
        <div class="qb-sub" id="qbSub"></div>
      </div>
    </div>

    <!-- Control Center: swipe down from the top of the screen (or tap the handle), like an iPhone -->
    <button id="ccPull" aria-label="Control Center"></button>
    <div id="cc">
      <div class="cc-sheet" id="ccSheet">
        <section class="cc-notifs glass">
          <header><span class="cc-h" data-t="notifications"></span><span class="cc-hb"><button class="cc-clear" id="ccUpd" data-t="updates"></button><button class="cc-clear" id="ccSys" data-t="androidPanel"></button><button class="cc-clear" id="ccClear" data-t="clearAll"></button></span></header>
          <div class="cc-list" id="ccList"></div>
        </section>
        <section class="cc-grid">
          <div class="cc-tile cc-conn glass">
            <button class="cc-tg" id="ccWifi" aria-label="Wi-Fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></svg><span>Wi-Fi</span></button>
            <button class="cc-tg" id="ccBt" aria-label="Bluetooth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></svg><span>Bluetooth</span></button>
            <button class="cc-tg" id="ccCast" aria-label="Cast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M3 12a8 8 0 0 1 8 8M3 16a4 4 0 0 1 4 4"/><circle cx="3.5" cy="19.5" r=".8" fill="currentColor"/></svg><span data-t="cast"></span></button>
            <button class="cc-tg" id="ccFiles" aria-label="File Transfer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 16v-5M9.5 13.5L12 11l2.5 2.5"/></svg><span data-t="files"></span></button>
          </div>
          <div class="cc-tile cc-media glass">
            <div class="cc-mtext"><div class="cc-mtitle" id="ccMTitle"></div><div class="cc-martist" id="ccMArtist"></div></div>
            <div class="cc-mctrls">
              <button data-c="previous" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
              <button data-c="toggle" id="ccMPlay" aria-label="Play or pause"></button>
              <button data-c="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 5H18v14h-2.4zM4 5v14l10.5-7z"/></svg></button>
            </div>
          </div>
          <div class="cc-tile cc-slider glass" id="ccBright" data-k="bright">
            <i class="cc-fill"></i><svg class="cc-sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
          </div>
          <div class="cc-tile cc-slider glass" id="ccVol" data-k="vol">
            <i class="cc-fill"></i><svg class="cc-sicon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </div>
          <button class="cc-tile cc-btn glass" id="ccMode"><span class="cc-bicon" id="ccModeIcon"></span><span id="ccModeName"></span></button>
          <button class="cc-tile cc-btn glass" id="ccSettings"><span class="cc-bicon"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.48.48 0 0 0 .12-.61l-1.92-3.32a.48.48 0 0 0-.59-.21l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54a7.36 7.36 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.21L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.48.48 0 0 0-.12.61l1.92 3.32c.12.21.37.3.59.21l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.25.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.36 7.36 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.21l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></span><span data-t="settings"></span></button>
        </section>
        <div class="cc-grab"></div>
      </div>
    </div>

    <!-- File Transfer: the car's files in your phone's browser, over Wi-Fi -->
    <div id="xfer">
      <div class="xf-panel glass solid">
        <div class="xf-head">
          <div><div class="xf-title" data-t="files"></div><div class="xf-sub" id="xfSub"></div></div>
          <button class="dr-close" id="xfClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="xf-body">
          <div class="xf-qrs" id="xfQrs"></div>
          <div class="xf-side">
            <ol class="xf-steps" id="xfSteps"></ol>
            <div class="xf-url" id="xfUrl"></div>
            <div class="xf-log" id="xfLog"></div>
            <div class="xf-btns">
              <button class="pk-btn" id="xfHotspot"></button>
              <button class="pk-btn main" id="xfToggle"></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Cast: no receiver app yet -->
    <div id="castInfo">
      <div class="pk-panel glass solid ci-panel">
        <div class="pk-head">
          <div class="pk-title" data-t="castTitle"></div>
          <div class="pk-sub ci-text" data-t="castText"></div>
        </div>
        <div class="pk-foot">
          <button class="pk-btn" id="ciClose" data-t="cancel"></button>
          <button class="pk-btn main" id="ciGet" data-t="castGet"></button>
        </div>
      </div>
    </div>

    <!-- Split screen: choose two apps to open side by side -->
    <div id="picker">
      <div class="pk-panel glass solid">
        <div class="pk-head">
          <div class="pk-title" data-t="pickTitle"></div>
          <div class="pk-sub" id="pkSub"></div>
        </div>
        <div class="pk-scroll"><div class="pk-grid" id="pkGrid"></div></div>
        <div class="pk-foot">
          <button class="pk-btn" id="pkCancel" data-t="cancel"></button>
          <button class="pk-btn main" id="pkGo" data-t="openSplit" disabled></button>
        </div>
      </div>
    </div>

    <!-- Long-press menu -->
    <div id="scrim"></div>
    <div id="pop" class="glass solid" hidden>
      <div id="popItems"></div>
      <div class="pop-tail"></div>
    </div>
  </main>

  <div id="toast" hidden></div>

  <!-- Eye comfort: a warm, dark layer over the whole page (touches go through) -->
  <div id="comfort"></div>

  <script src="bridge-mock.js"></script>
  <script src="config.js"></script>
  <script src="praytimes.js"></script>
  <script src="azkar.js"></script>
  <script src="dash.js"></script>
  <script src="qrcode.js"></script>
  <script src="car.js"></script>
  <script src="update.js"></script>
</body>
</html>
