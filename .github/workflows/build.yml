name: Build

# Builds the APKs (and, with bundletool, Android App Bundles for Google Play) on every push and pull request. Pushing a tag like v1.2.0, or a new
# versionName reaching main, also publishes a GitHub release with both APKs, signed with the key stored in the repository secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS) so updates install over earlier versions.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check page scripts
        run: for f in app/assets/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))"; done

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret (e.g. a fork): building with a throwaway key."
          fi

      # bundletool turns each app into an Android App Bundle (.aab) for Google Play as well.
      - name: bundletool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          echo "2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          echo "BUNDLETOOL=$RUNNER_TEMP/bundletool.jar" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mk-tv-car-launcher-apks
          path: |
            out/mk-tv-launcher.apk
            out/mk-car-launcher.apk
            out/mk-split-helper.apk
            out/mk-phone-launcher.apk
            out/*.aab

      # A pushed tag (v2.0.0) publishes that release. A push to main publishes the version in
      # app/AndroidManifest.xml (versionName) once, if there is no release for it yet.
      - name: Release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            TAG="v$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml)"
            gh release view "$TAG" >/dev/null 2>&1 || echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          cp out/mk-tv-launcher.apk "out/mk-tv-launcher-$TAG.apk"
          cp out/mk-car-launcher.apk "out/mk-car-launcher-$TAG.apk"
          cp out/mk-split-helper.apk "out/mk-split-helper-$TAG.apk"
          cp out/mk-phone-launcher.apk "out/mk-phone-launcher-$TAG.apk"
          for f in out/mk-*.aab; do b=$(basename "$f" .aab); cp "$f" "out/$b-$TAG.aab"; done
          SUMS=$(cd out && sha256sum mk-*-$TAG.apk mk-*-$TAG.aab)
          {
            echo "**Google TV / Android TV:** \`mk-tv-launcher-$TAG.apk\` (Android TV 9+). **Car head unit:** \`mk-car-launcher-$TAG.apk\` (Android 8+), and optionally \`mk-split-helper-$TAG.apk\` (MK Car Helper: Split, Now Playing, notifications; switch on *MK Split Screen* in Accessibility). **Phone:** \`mk-phone-launcher-$TAG.apk\` (Android 8+, foldables too). The \`.aab\` files are the same apps as Android App Bundles for Google Play. Install steps are in the README."
            echo
            [ -f docs/whats-new.md ] && cat docs/whats-new.md && echo
            echo "SHA-256:"
            echo '```'
            echo "$SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" out/mk-*-"$TAG".apk out/mk-*-"$TAG".aab --target "$GITHUB_SHA" --title "MK TV & Car Launcher ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
